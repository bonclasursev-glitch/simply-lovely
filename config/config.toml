[DASHBOARD_DEFAULTS]
dashboard_title = "Race Strategy Dashboard"
refresh_rate = 600
dashboard_layout = "wide"

[CACHE]
# Shared by every dashboard user and by preload_cache.py, relative paths start at the repo root
fastf1_cache_dir = "fastf1_cache"
